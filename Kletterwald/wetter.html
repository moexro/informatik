<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter-Overlay · Kletterwald Einsiedel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --green-dark:#17271c;
    --green-darker:#101c14;
    --terracotta:#a8552f;
    --terracotta-dark:#8a4526;
    --olive:#8fa23c;
    --olive-dark:#71812c;
    --cream:#ddd0af;
    --cream-light:#f3ecd8;
    --orange:#cc6a3a;
    --white:#ffffff;
    --ink:#251d12;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Poppins', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--terracotta);
    color:var(--white);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:14px 16px 30px;
  }

  .top-decor{
    position:fixed;
    top:0; left:0; right:0;
    height:26px;
    background:var(--green-dark);
    clip-path:polygon(0 0,100% 0,100% 30%,88% 100%,74% 25%,60% 100%,46% 20%,32% 100%,18% 25%,4% 100%,0 30%);
    z-index:0;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:900px;
    padding-top:34px;
  }

  .page-head{ text-align:center; margin-bottom:18px; }

  .eyebrow{
    font-weight:700;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--cream);
    margin:0 0 4px;
  }

  h1{
    font-family:var(--font-display);
    font-weight:800;
    text-transform:uppercase;
    font-size:clamp(1.35rem,2.6vw,1.9rem);
    line-height:1.05;
    margin:0 0 12px;
  }

  .date-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .today-date{
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:#f0e4cd;
    margin:0;
    text-transform:capitalize;
    min-width:180px;
  }

  .nav-btn{
    background:var(--olive);
    color:var(--white);
    border:none;
    border-radius:999px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.76rem;
    padding:9px 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  .nav-btn:active{ transform:translateY(1px); }
  .nav-btn.small{ padding:6px 12px; font-size:0.7rem; }

  .top-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin:20px 0 18px;
    align-items:stretch;
  }

  .card{
    background:var(--cream-light);
    border-radius:20px;
    padding:20px 22px;
    color:var(--ink);
  }

  .card h2{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:0.8rem;
    letter-spacing:0.04em;
    color:var(--terracotta-dark);
    margin:0 0 12px;
  }

  /* --- Öffnungszeiten-Karte --- */
  .hours-value{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:clamp(1.3rem,3vw,1.9rem);
  }
  .hours-value.closed{ color:var(--terracotta-dark); }

  .hours-sub{
    font-size:0.78rem;
    margin-top:8px;
    color:var(--terracotta-dark);
    line-height:1.6;
  }

  /* --- Temperatur-Karte --- */
  .temp-row{ display:flex; gap:18px; }
  .temp-stat{ flex:1; text-align:center; }
  .temp-label{
    font-size:0.68rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--terracotta-dark);
    margin-bottom:4px;
  }
  .temp-value{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:clamp(1.7rem,4vw,2.4rem);
  }
  .temp-value.cold{ color:var(--olive-dark); }
  .temp-value.hot{ color:var(--orange); }

  /* --- Regen-Balken-Karte --- */
  .rain-card{ padding-bottom:16px; margin-bottom:18px; }

  .rain-chart{
    display:flex;
    gap:6px;
    align-items:flex-end;
    overflow-x:auto;
    padding-top:6px;
    padding-bottom:4px;
  }

  .rain-col{ display:flex; flex-direction:column; align-items:center; flex:1; min-width:34px; }

  .rain-track{
    width:100%;
    max-width:26px;
    height:90px;
    background:rgba(37,29,18,0.08);
    border-radius:6px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }

  .rain-fill{ width:100%; border-radius:6px; background:var(--cream); transition:height .3s ease; }

  .rain-pct{ font-family:var(--font-mono); font-size:0.6rem; font-weight:600; margin-top:5px; color:var(--terracotta-dark); }
  .rain-hour{ font-family:var(--font-mono); font-size:0.6rem; margin-top:2px; color:var(--ink); opacity:0.55; }
  .rain-col.open-hour .rain-hour{ opacity:1; font-weight:700; color:var(--terracotta-dark); }

  .rain-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    font-size:0.68rem;
    color:var(--terracotta-dark);
  }

  .refresh-btn{
    background:none; border:none; color:var(--terracotta-dark);
    font-family:var(--font-body); font-weight:600; font-size:0.72rem;
    cursor:pointer; text-decoration:underline; padding:0;
  }

  .legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:0.62rem; }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* --- Regenradar-Karte --- */
  .radar-map{
    width:100%;
    height:300px;
    border-radius:14px;
    overflow:hidden;
    margin-top:6px;
  }

  .radar-controls{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:12px;
    flex-wrap:wrap;
  }

  .radar-slider{ flex:1; min-width:140px; accent-color:var(--olive); }

  .radar-time{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--terracotta-dark);
    min-width:110px;
    text-align:right;
  }

  @media (max-width:700px){
    .top-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="top-decor"></div>

<div class="page">
  <div class="page-head">
    <p class="eyebrow">Kletterwald Einsiedel · Intern</p>
    <h1>Wetter-Overlay</h1>
    <div class="date-nav">
      <button id="prevDay" class="nav-btn">← Ein Tag zurück</button>
      <p class="today-date" id="todayDate">–</p>
      <button id="nextDay" class="nav-btn">Ein Tag vor →</button>
    </div>
  </div>

  <div class="top-row">
    <div class="card">
      <h2>Öffnungszeiten</h2>
      <div class="hours-value" id="hoursValue">–</div>
      <div class="hours-sub" id="hoursSub"></div>
    </div>

    <div class="card">
      <h2 id="tempHeading">Temperatur</h2>
      <div class="temp-row">
        <div class="temp-stat">
          <div class="temp-label">Tief</div>
          <div class="temp-value cold" id="tempMin">–</div>
        </div>
        <div class="temp-stat">
          <div class="temp-label">Hoch</div>
          <div class="temp-value hot" id="tempMax">–</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card rain-card">
    <h2 id="rainHeading">Regenverlauf heute</h2>
    <div class="rain-chart" id="rainChart"></div>
    <div class="rain-footer">
      <div class="legend" id="rainLegend"></div>
      <div>
        <span id="rainUpdated">–</span>
        · <button class="refresh-btn" id="refreshBtn">Aktualisieren</button>
      </div>
    </div>
  </div>

  <div class="card radar-card">
    <h2>Regenradar · Umgebung</h2>
    <div id="radarMap" class="radar-map"></div>
    <div class="radar-controls">
      <button id="radarPlay" class="nav-btn small">▶ Abspielen</button>
      <input type="range" id="radarSlider" min="0" max="0" value="0" step="1" class="radar-slider">
      <span id="radarTimeLabel" class="radar-time">–</span>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     ÖFFNUNGSZEITEN — feste Regeln aus der aktuellen Saisontabelle
     (kletterwaldeinsiedel.de/besuch, Stand Saison 2026).
     WICHTIG: jede Saison von Hand aktualisieren (Saisonzeitraum,
     Ferien- und Feiertagsdaten ändern sich jedes Jahr).
     ============================================================ */

  const SEASON_2026 = { start: '2026-03-28', end: '2026-11-08' };

  const FERIEN_2026 = [
    { start: '2026-03-30', end: '2026-04-10' }, // Osterferien
    { start: '2026-05-26', end: '2026-06-05' }, // Pfingstferien
    { start: '2026-08-03', end: '2026-09-14' }, // Sommerferien
    { start: '2026-11-02', end: '2026-11-06' }  // Herbstferien
  ];

  const FEIERTAGE_2026 = [
    '2026-04-03','2026-04-06','2026-05-01','2026-05-14',
    '2026-05-25','2026-06-04','2026-08-15','2026-10-03','2026-11-01'
  ];

  const BRUECKENTAGE_2026 = ['2026-05-15']; // bei Bedarf ergänzen

  const ZEITUMSTELLUNG_2026 = '2026-10-25';

  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function inRange(ds, range){ return ds >= range.start && ds <= range.end; }
  function isFerien(ds){ return FERIEN_2026.some(r => inRange(ds, r)); }
  function isFeiertagOrBruecke(ds){ return FEIERTAGE_2026.includes(ds) || BRUECKENTAGE_2026.includes(ds); }

  function subMinutes(hhmm, minutes){
    const [h,m] = hhmm.split(':').map(Number);
    const total = h*60 + m - minutes;
    const hh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
    const mm = ((total % 60) + 60) % 60;
    return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  }

  function computeHours(date){
    const ds = isoDate(date);
    if (ds < SEASON_2026.start || ds > SEASON_2026.end) return { open:false, reason:'Saisonpause' };
    const month = date.getMonth() + 1;
    const day = date.getDay();
    const weekend = day === 0 || day === 6;
    const friday = day === 5;
    const ferien = isFerien(ds);
    const feiertag = isFeiertagOrBruecke(ds);

    if (month === 3 || month === 4){
      if (ferien || feiertag || weekend) return { open:true, from:'11:00', to:'19:00' };
      return { open:false, reason:'Regulärer Wochentag' };
    }
    if (month >= 5 && month <= 9){
      if (ferien || feiertag || weekend) return { open:true, from:'10:00', to:'19:00' };
      if (friday) return { open:true, from:'14:00', to:'19:00' };
      return { open:false, reason:'Regulärer Wochentag' };
    }
    if (ferien) return { open:true, from:'11:00', to:'17:00' };
    if (feiertag || weekend){
      const to = ds >= ZEITUMSTELLUNG_2026 ? '17:00' : '18:00';
      return { open:true, from:'11:00', to };
    }
    return { open:false, reason:'Regulärer Wochentag' };
  }

  function renderHours(date){
    const dateFmt = date.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'long' });
    document.getElementById('todayDate').textContent = dateFmt;

    const result = computeHours(date);
    const valueEl = document.getElementById('hoursValue');
    const subEl = document.getElementById('hoursSub');

    if (result.open){
      valueEl.classList.remove('closed');
      valueEl.textContent = `${result.from} – ${result.to} Uhr`;
      const kassenschluss = subMinutes(result.to, 120);
      const letzterAufstieg = subMinutes(result.to, 30);
      subEl.innerHTML = `Kassenschluss: ${kassenschluss} Uhr · Letzter Aufstieg: ${letzterAufstieg} Uhr`;
    } else {
      valueEl.classList.add('closed');
      valueEl.textContent = 'Geschlossen';
      subEl.textContent = result.reason;
    }
    return result;
  }

  /* ============================================================
     TAG-NAVIGATION
     ============================================================ */

  const TODAY = new Date(); TODAY.setHours(0,0,0,0);
  let dayOffset = 0;
  const MIN_OFFSET = -14, MAX_OFFSET = 14;

  function getSelectedDate(){
    const d = new Date(TODAY);
    d.setDate(TODAY.getDate() + dayOffset);
    return d;
  }

  /* ============================================================
     WETTER — Open-Meteo (schlüssellos, CORS-fähig, DWD-Basis).
     Wetter Online bietet keine öffentliche fetch()-fähige
     Schnittstelle — Open-Meteo liefert vergleichbare Daten,
     inkl. Vergangenheit (past_days) und Vorhersage (forecast_days).
     ============================================================ */

  const LAT = 49.9005, LON = 9.9575; // Kletterwald Einsiedel, Gramschatzer Wald

  function rainColor(pct){
    if (pct >= 80) return 'var(--terracotta-dark)';
    if (pct >= 50) return 'var(--orange)';
    if (pct >= 20) return 'var(--olive)';
    return 'var(--cream)';
  }

  function rainColorHex(pct){
    if (pct >= 80) return '#8a4526';
    if (pct >= 50) return '#cc6a3a';
    if (pct >= 20) return '#8fa23c';
    return '#ddd0af';
  }

  function renderLegend(isPast){
    const legend = document.getElementById('rainLegend');
    if (isPast){
      legend.innerHTML = `
        <span><i style="background:var(--cream)"></i>&lt;1mm</span>
        <span><i style="background:var(--olive)"></i>1–2,5mm</span>
        <span><i style="background:var(--orange)"></i>2,5–4mm</span>
        <span><i style="background:var(--terracotta-dark)"></i>&gt;4mm</span>`;
    } else {
      legend.innerHTML = `
        <span><i style="background:var(--cream)"></i>0–19%</span>
        <span><i style="background:var(--olive)"></i>20–49%</span>
        <span><i style="background:var(--orange)"></i>50–79%</span>
        <span><i style="background:var(--terracotta-dark)"></i>80–100%</span>`;
    }
  }

  async function loadWeather(selectedDate, openHours){
    const rainChart = document.getElementById('rainChart');
    const tempMin = document.getElementById('tempMin');
    const tempMax = document.getElementById('tempMax');
    const updatedEl = document.getElementById('rainUpdated');
    const rainHeading = document.getElementById('rainHeading');
    const tempHeading = document.getElementById('tempHeading');

    rainChart.innerHTML = '<p style="font-size:0.8rem;color:var(--terracotta-dark);">Lade Wetterdaten…</p>';

    const diffDays = Math.round((selectedDate - TODAY) / 86400000);
    const isPast = diffDays < 0;
    const past_days = isPast ? Math.min(92, -diffDays) : 0;
    const forecast_days = isPast ? 1 : Math.min(16, diffDays + 1);

    tempHeading.textContent = 'Temperatur' + (diffDays === 0 ? ' heute' : isPast ? ' (gemessen)' : ' (Vorhersage)');
    rainHeading.textContent = 'Regenverlauf' + (diffDays === 0 ? ' heute' : isPast ? ' (gemessen)' : ' (Vorhersage)');
    renderLegend(isPast);

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min&hourly=precipitation_probability,precipitation,temperature_2m&timezone=Europe%2FBerlin&past_days=${past_days}&forecast_days=${forecast_days}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Netzwerkfehler');
      const data = await res.json();

      const ds = isoDate(selectedDate);
      const dayIdx = data.daily.time.indexOf(ds);
      const hourStartIdx = data.hourly.time.findIndex(t => t.startsWith(ds));

      if (dayIdx === -1 || hourStartIdx === -1) throw new Error('Datum außerhalb des verfügbaren Bereichs');

      const startHour = 8, endHour = 20;
      let openFrom = -1, openTo = -1;
      if (openHours.open){
        openFrom = parseInt(openHours.from.slice(0,2), 10);
        openTo = parseInt(openHours.to.slice(0,2), 10);
      }

      if (openHours.open){
        const openTemps = [];
        for (let h = openFrom; h <= openTo; h++){
          const t = data.hourly.temperature_2m[hourStartIdx + h];
          if (t !== undefined && t !== null) openTemps.push(t);
        }
        tempMax.textContent = Math.round(Math.max(...openTemps)) + '°';
        tempMin.textContent = Math.round(Math.min(...openTemps)) + '°';
      } else {
        tempMax.textContent = Math.round(data.daily.temperature_2m_max[dayIdx]) + '°';
        tempMin.textContent = Math.round(data.daily.temperature_2m_min[dayIdx]) + '°';
        tempHeading.textContent += ' · ganzer Tag, geschlossen';
      }

      rainChart.innerHTML = '';
      for (let h = startHour; h <= endHour; h++){
        const idx = hourStartIdx + h;
        let pct, label;
        if (isPast){
          const mm = data.hourly.precipitation[idx] ?? 0;
          pct = Math.min(100, Math.round((mm / 5) * 100));
          label = mm.toFixed(1) + 'mm';
        } else {
          pct = data.hourly.precipitation_probability[idx] ?? 0;
          label = pct + '%';
        }

        const col = document.createElement('div');
        col.className = 'rain-col';
        if (openHours.open && h >= openFrom && h < openTo) col.classList.add('open-hour');

        col.innerHTML = `
          <div class="rain-track">
            <div class="rain-fill" style="height:${Math.max(pct,3)}%;background:${rainColor(pct)}"></div>
          </div>
          <div class="rain-pct">${label}</div>
          <div class="rain-hour">${String(h).padStart(2,'0')}</div>
        `;
        rainChart.appendChild(col);
      }

      const now = new Date();
      updatedEl.textContent = 'Stand: ' + now.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }) + ' Uhr';
    } catch (err){
      rainChart.innerHTML = '<p style="font-size:0.8rem;color:var(--terracotta-dark);">Wetterdaten für diesen Tag nicht verfügbar.</p>';
      updatedEl.textContent = 'Fehler beim Laden';
    }
  }

  function init(){
    const selectedDate = getSelectedDate();
    const openHours = renderHours(selectedDate);
    loadWeather(selectedDate, openHours);
  }

  document.getElementById('refreshBtn').addEventListener('click', init);
  document.getElementById('prevDay').addEventListener('click', () => {
    dayOffset = Math.max(MIN_OFFSET, dayOffset - 1);
    init();
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    dayOffset = Math.min(MAX_OFFSET, dayOffset + 1);
    init();
  });

  init();

  /* ============================================================
     REGENKARTE — Leaflet + RainViewer (Live) + Open-Meteo (Vorhersage).
     Ein Schieberegler für alles: erst echte Radarbilder (letzte
     ~2 Std. gemessen + ~30–60 Min. Nowcast von RainViewer), danach
     geht er nahtlos in eine Vorhersage-Zone über — eine eingefärbte
     Fläche über dem Kletterwald, deren Farbe die Regenwahrschein-
     lichkeit der jeweiligen Stunde zeigt, bis morgen 19:00 Uhr.
     Die Vorhersage-Frames sind keine echten Radarbilder (das gibt
     es für die Zukunft nirgends kostenlos) — daher andere Optik
     (Kreis statt Kachel-Radar) und eigene Kennzeichnung im Zeit-Label.
     ============================================================ */

  let radarMap, radarLayer, radarCircle, radarFrames = [], radarIndex = 0, radarTimer = null;

  function initRadarMap(){
    radarMap = L.map('radarMap', { zoomControl:true, attributionControl:true, maxZoom:18 }).setView([LAT, LON], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'&copy; OpenStreetMap-Mitwirkende | Live-Radar: RainViewer | Vorhersage: Open-Meteo',
      maxZoom:19
    }).addTo(radarMap);
    L.marker([LAT, LON]).addTo(radarMap).bindPopup('Kletterwald Einsiedel');
    loadRadarAndForecast();
  }

  async function loadRadarAndForecast(){
    try {
      const [radarRes, meteoRes] = await Promise.all([
        fetch('https://api.rainviewer.com/public/weather-maps.json'),
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=precipitation_probability&timezone=Europe%2FBerlin&forecast_days=2`)
      ]);
      const radarData = await radarRes.json();
      const meteoData = await meteoRes.json();

      const host = radarData.host;
      const pastFrames = (radarData.radar.past || []).map(f => ({ time:f.time, path:host+f.path, kind:'past' }));
      const nowcastFrames = (radarData.radar.nowcast || []).map(f => ({ time:f.time, path:host+f.path, kind:'nowcast' }));

      const now = new Date();
      const forecastFrames = [];
      for (let h = now.getHours() + 1; h <= 19; h++){
        const t = new Date(); t.setHours(h, 0, 0, 0);
        forecastFrames.push({ time: Math.floor(t.getTime()/1000), kind:'forecast', pct: meteoData.hourly.precipitation_probability[h] ?? 0 });
      }
      for (let h = 8; h <= 19; h++){
        const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(h, 0, 0, 0);
        forecastFrames.push({ time: Math.floor(t.getTime()/1000), kind:'forecast', pct: meteoData.hourly.precipitation_probability[24+h] ?? 0 });
      }

      radarFrames = pastFrames.concat(nowcastFrames, forecastFrames).sort((a,b) => a.time - b.time);

      const nowTs = Date.now() / 1000;
      let closestIdx = 0, closestDiff = Infinity;
      radarFrames.forEach((f,i) => {
        const diff = Math.abs(f.time - nowTs);
        if (diff < closestDiff){ closestDiff = diff; closestIdx = i; }
      });
      radarIndex = closestIdx;

      const slider = document.getElementById('radarSlider');
      slider.max = radarFrames.length - 1;
      slider.value = radarIndex;
      slider.addEventListener('input', () => {
        radarIndex = parseInt(slider.value, 10);
        showRadarFrame();
      });

      showRadarFrame();
    } catch (err){
      document.getElementById('radarTimeLabel').textContent = 'Nicht erreichbar';
    }
  }

  function showRadarFrame(){
    if (!radarFrames.length) return;
    const frame = radarFrames[radarIndex];

    if (frame.kind === 'forecast'){
      if (radarLayer){ radarMap.removeLayer(radarLayer); radarLayer = null; }
      if (!radarCircle){
        radarCircle = L.circle([LAT, LON], { radius:12000, weight:0, fillOpacity:0.4 });
      }
      radarCircle.setStyle({ fillColor: rainColorHex(frame.pct) });
      if (!radarMap.hasLayer(radarCircle)) radarCircle.addTo(radarMap);
    } else {
      if (radarCircle && radarMap.hasLayer(radarCircle)) radarMap.removeLayer(radarCircle);
      if (radarLayer) radarMap.removeLayer(radarLayer);
      const url = frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
      radarLayer = L.tileLayer(url, { tileSize:256, opacity:0.65, maxZoom:18, maxNativeZoom:10 }).addTo(radarMap);
    }

    const dt = new Date(frame.time * 1000);
    const dateLabel = dt.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit' });
    const timeLabel = dt.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
    const kindLabel = frame.kind === 'past' ? 'Live'
      : frame.kind === 'nowcast' ? 'Live-Vorhersage'
      : `Vorhersage · ${frame.pct}%`;
    document.getElementById('radarTimeLabel').textContent = `${dateLabel} ${timeLabel} · ${kindLabel}`;
    document.getElementById('radarSlider').value = radarIndex;
  }

  document.getElementById('radarPlay').addEventListener('click', () => {
    const btn = document.getElementById('radarPlay');
    if (radarTimer){
      clearInterval(radarTimer);
      radarTimer = null;
      btn.textContent = '▶ Abspielen';
      return;
    }
    btn.textContent = '⏸ Stopp';
    radarTimer = setInterval(() => {
      radarIndex = (radarIndex + 1) % radarFrames.length;
      showRadarFrame();
    }, 500);
  });

  initRadarMap();
</script>

</body>
</html>
