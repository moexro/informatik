<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter-Overlay · Kletterwald Einsiedel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-dark:#17271c;
    --green-darker:#101c14;
    --terracotta:#a8552f;
    --terracotta-dark:#8a4526;
    --olive:#8fa23c;
    --olive-dark:#71812c;
    --cream:#ddd0af;
    --cream-light:#f3ecd8;
    --orange:#cc6a3a;
    --white:#ffffff;
    --ink:#251d12;
    --font-display:'Baloo 2', sans-serif;
    --font-body:'Poppins', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--terracotta);
    color:var(--white);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:14px 16px 26px;
  }

  .top-decor{
    position:fixed;
    top:0; left:0; right:0;
    height:26px;
    background:var(--green-dark);
    clip-path:polygon(0 0,100% 0,100% 30%,88% 100%,74% 25%,60% 100%,46% 20%,32% 100%,18% 25%,4% 100%,0 30%);
    z-index:0;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:900px;
    padding-top:34px;
  }

  .page-head{ text-align:center; margin-bottom:18px; }

  .eyebrow{
    font-weight:700;
    font-size:0.7rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--cream);
    margin:0 0 4px;
  }

  h1{
    font-family:var(--font-display);
    font-weight:800;
    text-transform:uppercase;
    font-size:clamp(1.35rem,2.6vw,1.9rem);
    line-height:1.05;
    margin:0 0 6px;
  }

  .today-date{
    font-family:var(--font-mono);
    font-size:0.78rem;
    color:#f0e4cd;
    margin:0;
    text-transform:capitalize;
  }

  .top-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:18px;
    align-items:stretch;
  }

  .card{
    background:var(--cream-light);
    border-radius:20px;
    padding:20px 22px;
    color:var(--ink);
  }

  .card h2{
    font-family:var(--font-display);
    text-transform:uppercase;
    font-size:0.8rem;
    letter-spacing:0.04em;
    color:var(--terracotta-dark);
    margin:0 0 12px;
  }

  /* --- Öffnungszeiten-Karte --- */
  .hours-value{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:clamp(1.3rem,3vw,1.9rem);
  }
  .hours-value.closed{ color:var(--terracotta-dark); }

  .hours-sub{
    font-size:0.78rem;
    margin-top:8px;
    color:var(--terracotta-dark);
    line-height:1.6;
  }

  .tag-chip{
    display:inline-block;
    background:var(--olive);
    color:var(--white);
    font-size:0.62rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:3px 10px;
    border-radius:999px;
    margin-top:10px;
  }

  /* --- Temperatur-Karte --- */
  .temp-row{
    display:flex;
    gap:18px;
  }
  .temp-stat{ flex:1; text-align:center; }
  .temp-label{
    font-size:0.68rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--terracotta-dark);
    margin-bottom:4px;
  }
  .temp-value{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:clamp(1.7rem,4vw,2.4rem);
  }
  .temp-value.cold{ color:var(--olive-dark); }
  .temp-value.hot{ color:var(--orange); }

  /* --- Regen-Karte --- */
  .rain-card{ padding-bottom:16px; }

  .rain-chart{
    display:flex;
    gap:6px;
    align-items:flex-end;
    overflow-x:auto;
    padding-top:6px;
    padding-bottom:4px;
  }

  .rain-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
    min-width:34px;
  }

  .rain-track{
    width:100%;
    max-width:26px;
    height:90px;
    background:rgba(37,29,18,0.08);
    border-radius:6px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }

  .rain-fill{
    width:100%;
    border-radius:6px;
    background:var(--cream);
    transition:height .3s ease;
  }

  .rain-pct{
    font-family:var(--font-mono);
    font-size:0.6rem;
    font-weight:600;
    margin-top:5px;
    color:var(--terracotta-dark);
  }

  .rain-hour{
    font-family:var(--font-mono);
    font-size:0.6rem;
    margin-top:2px;
    color:var(--ink);
    opacity:0.55;
  }

  .rain-col.open-hour .rain-hour{
    opacity:1;
    font-weight:700;
    color:var(--terracotta-dark);
  }

  .rain-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
    font-size:0.68rem;
    color:var(--terracotta-dark);
  }

  .refresh-btn{
    background:none;
    border:none;
    color:var(--terracotta-dark);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.72rem;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }

  .legend{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    font-size:0.62rem;
  }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  @media (max-width:700px){
    .top-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="top-decor"></div>

<div class="page">
  <div class="page-head">
    <p class="eyebrow">Kletterwald Einsiedel · Intern</p>
    <h1>Wetter-Overlay</h1>
    <p class="today-date" id="todayDate">–</p>
  </div>

  <div class="top-row">
    <div class="card">
      <h2>Heute geöffnet</h2>
      <div class="hours-value" id="hoursValue">–</div>
      <div class="hours-sub" id="hoursSub"></div>
    </div>

    <div class="card">
      <h2>Temperatur heute</h2>
      <div class="temp-row">
        <div class="temp-stat">
          <div class="temp-label">Tief</div>
          <div class="temp-value cold" id="tempMin">–</div>
        </div>
        <div class="temp-stat">
          <div class="temp-label">Hoch</div>
          <div class="temp-value hot" id="tempMax">–</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card rain-card">
    <h2>Regenverlauf heute</h2>
    <div class="rain-chart" id="rainChart"></div>
    <div class="rain-footer">
      <div class="legend">
        <span><i style="background:var(--cream)"></i>0–19%</span>
        <span><i style="background:var(--olive)"></i>20–49%</span>
        <span><i style="background:var(--orange)"></i>50–79%</span>
        <span><i style="background:var(--terracotta-dark)"></i>80–100%</span>
      </div>
      <div>
        <span id="rainUpdated">–</span>
        · <button class="refresh-btn" id="refreshBtn">Aktualisieren</button>
      </div>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     ÖFFNUNGSZEITEN — feste Regeln aus der aktuellen Saisontabelle
     (kletterwaldeinsiedel.de/besuch, Stand Saison 2026).
     Läuft komplett lokal im Browser, kein Abruf von der Website
     nötig (die Seite liefert keine CORS-freie Schnittstelle dafür).

     WICHTIG: Diese Tabelle muss jede Saison von Hand aktualisiert
     werden — Saisonzeitraum, Ferien- und Feiertagsdaten ändern
     sich jedes Jahr. Quelle: kletterwaldeinsiedel.de/besuch
     ============================================================ */

  const SEASON_2026 = { start: '2026-03-28', end: '2026-11-08' };

  const FERIEN_2026 = [
    { start: '2026-03-30', end: '2026-04-10' }, // Osterferien
    { start: '2026-05-26', end: '2026-06-05' }, // Pfingstferien
    { start: '2026-08-03', end: '2026-09-14' }, // Sommerferien
    { start: '2026-11-02', end: '2026-11-06' }  // Herbstferien
  ];

  const FEIERTAGE_2026 = [
    '2026-04-03', // Karfreitag
    '2026-04-06', // Ostermontag
    '2026-05-01', // 1. Mai
    '2026-05-14', // Christi Himmelfahrt
    '2026-05-25', // Pfingstmontag
    '2026-06-04', // Fronleichnam
    '2026-08-15', // Mariä Himmelfahrt
    '2026-10-03', // Tag der Deutschen Einheit
    '2026-11-01'  // Allerheiligen
  ];

  // Von euch bei Bedarf ergänzbar, falls ihr an einem Brückentag öffnet
  const BRUECKENTAGE_2026 = [
    '2026-05-15' // Freitag nach Christi Himmelfahrt
  ];

  const ZEITUMSTELLUNG_2026 = '2026-10-25'; // Ende Sommerzeit

  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function inRange(ds, range){ return ds >= range.start && ds <= range.end; }
  function isFerien(ds){ return FERIEN_2026.some(r => inRange(ds, r)); }
  function isFeiertagOrBruecke(ds){ return FEIERTAGE_2026.includes(ds) || BRUECKENTAGE_2026.includes(ds); }

  function subMinutes(hhmm, minutes){
    const [h,m] = hhmm.split(':').map(Number);
    const total = h*60 + m - minutes;
    const hh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
    const mm = ((total % 60) + 60) % 60;
    return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  }

  function computeHours(date){
    const ds = isoDate(date);
    if (ds < SEASON_2026.start || ds > SEASON_2026.end){
      return { open:false, reason:'Saisonpause' };
    }
    const month = date.getMonth() + 1;
    const day = date.getDay(); // 0=So .. 6=Sa
    const weekend = day === 0 || day === 6;
    const friday = day === 5;
    const ferien = isFerien(ds);
    const feiertag = isFeiertagOrBruecke(ds);

    if (month === 3 || month === 4){
      if (ferien || feiertag || weekend) return { open:true, from:'11:00', to:'19:00' };
      return { open:false, reason:'Regulärer Wochentag' };
    }
    if (month >= 5 && month <= 9){
      if (ferien || feiertag || weekend) return { open:true, from:'10:00', to:'19:00' };
      if (friday) return { open:true, from:'14:00', to:'19:00' };
      return { open:false, reason:'Regulärer Wochentag' };
    }
    // Oktober / November
    if (ferien) return { open:true, from:'11:00', to:'17:00' };
    if (feiertag || weekend){
      const to = ds >= ZEITUMSTELLUNG_2026 ? '17:00' : '18:00';
      return { open:true, from:'11:00', to };
    }
    return { open:false, reason:'Regulärer Wochentag' };
  }

  function renderHours(){
    const now = new Date();
    const dateFmt = now.toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'long' });
    document.getElementById('todayDate').textContent = dateFmt;

    const result = computeHours(now);
    const valueEl = document.getElementById('hoursValue');
    const subEl = document.getElementById('hoursSub');

    if (result.open){
      valueEl.classList.remove('closed');
      valueEl.textContent = `${result.from} – ${result.to} Uhr`;
      const kassenschluss = subMinutes(result.to, 120);
      const letzterAufstieg = subMinutes(result.to, 30);
      subEl.innerHTML = `Kassenschluss: ${kassenschluss} Uhr · Letzter Aufstieg: ${letzterAufstieg} Uhr`;
    } else {
      valueEl.classList.add('closed');
      valueEl.textContent = 'Geschlossen';
      subEl.textContent = result.reason;
    }
    return result;
  }

  /* ============================================================
     WETTER — Open-Meteo (keinlosen, CORS-fähig, DWD-Basis).
     Wetter Online bietet keine öffentliche, per fetch() nutzbare
     Schnittstelle (kein CORS) — Open-Meteo liefert die gleiche
     Art Daten (Tageswerte, stündlicher Niederschlag) zuverlässig.
     ============================================================ */

  const LAT = 49.9005, LON = 9.9575; // Kletterwald Einsiedel, Gramschatzer Wald

  async function loadWeather(openHours){
    const rainChart = document.getElementById('rainChart');
    const tempMin = document.getElementById('tempMin');
    const tempMax = document.getElementById('tempMax');
    const updatedEl = document.getElementById('rainUpdated');

    rainChart.innerHTML = '<p style="font-size:0.8rem;color:var(--terracotta-dark);">Lade Wetterdaten…</p>';

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min&hourly=precipitation_probability,precipitation&timezone=Europe%2FBerlin&forecast_days=1`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Netzwerkfehler');
      const data = await res.json();

      tempMax.textContent = Math.round(data.daily.temperature_2m_max[0]) + '°';
      tempMin.textContent = Math.round(data.daily.temperature_2m_min[0]) + '°';

      const startHour = 8, endHour = 20;
      let openFrom = -1, openTo = -1;
      if (openHours.open){
        openFrom = parseInt(openHours.from.slice(0,2), 10);
        openTo = parseInt(openHours.to.slice(0,2), 10);
      }

      rainChart.innerHTML = '';
      for (let h = startHour; h <= endHour; h++){
        const prob = data.hourly.precipitation_probability[h] ?? 0;
        const col = document.createElement('div');
        col.className = 'rain-col';
        if (openHours.open && h >= openFrom && h < openTo) col.classList.add('open-hour');

        let color = 'var(--cream)';
        if (prob >= 80) color = 'var(--terracotta-dark)';
        else if (prob >= 50) color = 'var(--orange)';
        else if (prob >= 20) color = 'var(--olive)';

        col.innerHTML = `
          <div class="rain-track">
            <div class="rain-fill" style="height:${Math.max(prob,3)}%;background:${color}"></div>
          </div>
          <div class="rain-pct">${prob}%</div>
          <div class="rain-hour">${String(h).padStart(2,'0')}</div>
        `;
        rainChart.appendChild(col);
      }

      const now = new Date();
      updatedEl.textContent = 'Stand: ' + now.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' }) + ' Uhr';
    } catch (err){
      rainChart.innerHTML = '<p style="font-size:0.8rem;color:var(--terracotta-dark);">Wetterdaten gerade nicht erreichbar.</p>';
      updatedEl.textContent = 'Fehler beim Laden';
    }
  }

  function init(){
    const openHours = renderHours();
    loadWeather(openHours);
  }

  document.getElementById('refreshBtn').addEventListener('click', init);
  init();
</script>

</body>
</html>
