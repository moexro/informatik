<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antike Steckbriefe - A3 Plakat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: white;
            padding: 0;
        }
        
        .page {
            width: 420mm;
            height: 297mm;
            background: white;
            padding: 15mm;
            display: flex;
            flex-direction: column;
            gap: 10mm;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #9B7D54;
            padding-bottom: 8mm;
            margin-bottom: 5mm;
        }
        
        .header h1 {
            font-size: 42px;
            color: #2C2C2C;
            font-weight: bold;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #9B7D54;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        .header .period {
            background: #9B7D54;
            color: white;
            padding: 8mm 12mm;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8mm;
            flex: 1;
        }
        
        .steckbrief {
            border: 2px solid #9B7D54;
            background: white;
            border-radius: 4px;
            min-height: 85mm;
            overflow: hidden;
        }
        
        .steckbrief img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .page {
                width: 100%;
                height: 100%;
                padding: 15mm;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <div class="subtitle">ANTIKE WELT</div>
                <h1>Klassische Antike</h1>
            </div>
            <div class="period">800 v.Chr. – 500 n.Chr.</div>
        </div>
        
        <div class="grid">
            <div class="steckbrief"><img src="IMG_3290.png" alt="Römische Republik/Senat und Volk von Rom"></div>
            <div class="steckbrief"><img src="IMG_3289.png" alt="Byzanz - das zweite Rom"></div>
            <div class="steckbrief"><img src="IMG_3288.png" alt="Griechische Stadtstaaten"></div>
            <div class="steckbrief"><img src="IMG_3285.png" alt="Demokratie Athens"></div>
            <div class="steckbrief"><img src="IMG_3292.jpeg" alt="Mission und Macht"></div>
            <div class="steckbrief"><img src="IMG_3287.jpeg" alt="Franken, Merowinger, Karolinger"></div>
            <div class="steckbrief"><img src="IMG_3286.jpeg" alt="Imperium Romanum - Caesar und Augustus"></div>
            <div class="steckbrief"><img src="IMG_3284.jpeg" alt="Alexander der Große"></div>
            <div class="steckbrief"><img src="IMG_3291.jpeg" alt="Römer, jüdische Aufstände und frühe Christen"></div>
        </div>
    </div>
</body>
</html>
