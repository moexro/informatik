<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antike Steckbriefe - A3 Plakat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: white;
            padding: 0;
        }
        
        .page {
            width: 420mm;
            height: 297mm;
            background: white;
            padding: 15mm;
            display: flex;
            flex-direction: column;
            gap: 10mm;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #9B7D54;
            padding-bottom: 8mm;
            margin-bottom: 5mm;
        }
        
        .header h1 {
            font-size: 42px;
            color: #2C2C2C;
            font-weight: bold;
        }
        
        .header .subtitle {
            font-size: 14px;
            color: #9B7D54;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        .header .period {
            background: #9B7D54;
            color: white;
            padding: 8mm 12mm;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 8mm;
            flex: 1;
        }
        
        .gallery-row {
            display: flex;
            gap: 8mm;
            height: 75mm;
        }
        
        .steckbrief {
            border: 2px solid #9B7D54;
            background: white;
            border-radius: 4px;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }
        
        .steckbrief img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: white;
        }
        
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .page {
                width: 100%;
                height: 100%;
                padding: 15mm;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div>
                <div class="subtitle">ANTIKE WELT</div>
                <h1>Klassische Antike</h1>
            </div>
            <div class="period">800 v.Chr. – 500 n.Chr.</div>
        </div>
        
        <div class="gallery" id="gallery">
            <!-- Reihe 1 -->
            <div class="gallery-row">
                <div class="steckbrief"><img src="IMG_3290.png" alt="Römische Republik/Senat und Volk von Rom"></div>
                <div class="steckbrief"><img src="IMG_3289.png" alt="Byzanz - das zweite Rom"></div>
                <div class="steckbrief"><img src="IMG_3288.png" alt="Griechische Stadtstaaten"></div>
            </div>
            <!-- Reihe 2 -->
            <div class="gallery-row">
                <div class="steckbrief"><img src="IMG_3285.png" alt="Demokratie Athens"></div>
                <div class="steckbrief"><img src="IMG_3292.jpeg" alt="Mission und Macht"></div>
                <div class="steckbrief"><img src="IMG_3287.jpeg" alt="Franken, Merowinger, Karolinger"></div>
            </div>
            <!-- Reihe 3 -->
            <div class="gallery-row">
                <div class="steckbrief"><img src="IMG_3286.jpeg" alt="Imperium Romanum - Caesar und Augustus"></div>
                <div class="steckbrief"><img src="IMG_3284.jpeg" alt="Alexander der Große"></div>
                <div class="steckbrief"><img src="IMG_3291.jpeg" alt="Römer, jüdische Aufstände und frühe Christen"></div>
            </div>
        </div>
    </div>

    <script>
        // Optimale Höhe für Galeriereihen berechnen
        function layoutGallery() {
            const gallery = document.getElementById('gallery');
            const rows = gallery.querySelectorAll('.gallery-row');
            const gap = 8; // mm in px (ca.)
            
            rows.forEach(row => {
                const boxes = row.querySelectorAll('.steckbrief');
                const imgs = Array.from(boxes).map(box => box.querySelector('img'));
                
                // Warten bis alle Bilder geladen sind
                Promise.all(imgs.map(img => {
                    return new Promise(resolve => {
                        if (img.complete) {
                            resolve();
                        } else {
                            img.onload = resolve;
                            img.onerror = resolve;
                        }
                    });
                })).then(() => {
                    // Aspekt-Verhältnisse auslesen
                    const aspects = imgs.map(img => img.naturalWidth / img.naturalHeight);
                    
                    // Verfügbare Breite berechnen (in relativen Einheiten)
                    const totalGapWidth = (boxes.length - 1) * gap;
                    const availableWidth = row.offsetWidth - totalGapWidth;
                    
                    // Optimale Höhe berechnen
                    const optimalHeight = availableWidth / (aspects.reduce((a, b) => a + b, 0));
                    
                    // Höhe setzen
                    row.style.height = optimalHeight + 'px';
                    
                    // Box-Breiten basierend auf Aspekt-Verhältnis anpassen
                    boxes.forEach((box, idx) => {
                        const width = aspects[idx] * optimalHeight;
                        box.style.flex = `0 0 ${width}px`;
                    });
                });
            });
        }
        
        // Initial layout
        window.addEventListener('load', layoutGallery);
        window.addEventListener('resize', layoutGallery);
        
        // Kleine Verzögerung für Edge-Cases
        setTimeout(layoutGallery, 100);
    </script>
</body>
</html>
